<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Portal Kelas & Playlist Materi</title>
 
  <!-- TEMPLATE CSS: Framework Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
  <link rel="stylesheet" href="./CSS/kelas.css">
</head>
<body>
  <!-- NAVBAR & LINK -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">EduSpark 🎓</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- LINK / NAVIGASI -->
                    <li class="nav-item"><a class="nav-link active" href="home.html">Beranda</a></li>
                </ul>
                <!-- ELEMEN JAVASCRIPT: Tombol Toggle Mode Gelap -->
                <button class="btn btn-outline-light ms-3" id="themeToggleBtn" onclick="toggleDarkMode()">🌙 Mode Gelap</button>
            </div>
        </div>
    </nav>
  <div class="container">
    <div class="lms-wrapper">
      
      <!-- KOLOM KIRI: MAIN PLAYER & INFORMASI -->
      <main class="main-content">
        <!-- Embedded Video Player -->
        <div class="video-wrapper">
          <iframe 
            id="videoPlayer" 
            src="" 
            title="Video Player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>

        <div class="content-details">
          <div class="video-header">
            <h1 id="videoTitle" class="video-title">Memuat judul...</h1>
          </div>

          <hr>

          <!-- Deskripsi Kurikulum / Ringkasan -->
          <div class="description-box">
            <h4>📖 Detail & Kurikulum Materi</h4>
            <p id="videoDesc">-</p>
          </div>
        </div>
      </main>

      <!-- KOLOM KANAN: SIDEBAR MATERI (PLAYLIST) -->
      <aside class="sidebar">
        <h2 class="sidebar-title">Materi</h2>
        <div class="playlist-container" id="playlistContainer">
          <!-- Daftar playlist akan di-render via JavaScript -->         
        </div>
        <hr>
        <div>
          <a class="btn btn-primary w-100" id="downloadPlaylistBtn" href="https://www.youtube.com/@KelasTerbuka" target="_blank" class="button-link">Channel Kelas Terbuka</a>
        </div>
      </aside>

    </div>
  </div>

  <script src="./JS/kelas_java.js"></script>
</body>
</html>
